# Optional: publish `web/` as the site root via GitHub Actions.
# Currently Pages is configured as branch `main` / (legacy), so the live
# app URL is https://alid67-git.github.io/DayAtlas/web/ and the repo-root
# index.html redirects there. Switch Settings → Pages → Source to
# "GitHub Actions" before relying on this workflow as the primary deploy.
name: Deploy web PWA to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
